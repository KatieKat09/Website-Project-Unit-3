<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Happy Paws</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">🐾 Happy Paws</h2>
        <ul class="nav-links">
            <li><a href="Index.html">Home</a></li>
            <li><a href="adoption.html">Adoption</a></li>
            <li><a href="rescue.html">Rescue</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<section class="page-heading">
    <h1>Contact Us</h1>
    <p>We would love to hear from you!</p>
</section>

<section class="form-container">

    <h2>Send Us a Message</h2>

    <form id="contactForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="subject">Subject</label>
        <input type="text" id="subject" required>

        <label for="message">Your Message</label>
        <textarea id="message" rows="5" required></textarea>

        <button type="submit" class="btn">Send Message</button>

    </form>

    <p id="contactResponse" role="status" aria-live="polite"></p>

</section>

<footer>
    <p>&copy; 2026 Happy Paws Animal Rescue. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
